[workspace]
resolver = "2"
members = [
    "crates/fm-core",
    "crates/fm-engine",
    "crates/fm-similarity",
    "crates/fm-graph",
    "crates/fm-store",
    "crates/fm-embed",
    "crates/fm-persist",
    "crates/fm-server",
    "crates/fm-py",
    "crates/fm-cluster",
    "crates/fm-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["Fusion-MLX Team"]
repository = "https://github.com/dahai80/fusion-memory"

[workspace.dependencies]
# 内部 crate
fm-core = { path = "crates/fm-core" }
fm-engine = { path = "crates/fm-engine" }
fm-similarity = { path = "crates/fm-similarity" }
fm-graph = { path = "crates/fm-graph" }
fm-store = { path = "crates/fm-store" }
fm-embed = { path = "crates/fm-embed" }
fm-persist = { path = "crates/fm-persist" }
fm-server = { path = "crates/fm-server" }
fm-py = { path = "crates/fm-py" }
fm-cluster = { path = "crates/fm-cluster" }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# 错误处理
anyhow = "1"
thiserror = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ID
ulid = "1"

# 存储
rusqlite = { version = "0.40", features = ["bundled"] }
# sled 1.0-alpha 的 Db/Tree 非 Sync（RefCell EBR），换稳定 0.34（Send+Sync）。Rule 7。
sled = "0.34"
hnsw_rs = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP client (fusion-mlx embedding/chat, 127.0.0.1 only, 无 TLS)
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# HTTP server (fm-server, Bearer 鉴权, B5)
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["trace"] }

# PyO3 (fm-py, GIL 安全, C2)
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
pyo3-asyncio = { version = "0.22", features = ["tokio-runtime"] }

# 测试
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
