[package]
name = "fm-fuzz"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "fusion-memory fuzz targets (cargo-fuzz). JSON-RPC line parser + HTTP body boundary."
publish = false

[dependencies]
fm-server = { workspace = true }
serde_json = { workspace = true }

# cargo-fuzz 用 libFuzzer。仅 fuzz 配置下拉。
[dependencies.libfuzzer-sys]
version = "0.4"
optional = true

[features]
fuzz = ["libfuzzer-sys"]

[lib]
path = "lib.rs"
