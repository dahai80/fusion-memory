[package]
name = "fm-engine"
version = "1.1.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "fusion-memory 引擎: commit/retrieve/consolidate + 实体抽取 + 融合评分。PRD §6, §11.1, §11.4"

[features]
# 真实模型集成测试 (需起 fusion-mlx 加载 Qwen3.5-9B-4bit)
# 跑: cargo test -p fm-engine --features mlx-live --test mlx_live_extract -- --include-ignored
mlx-live = []

[dependencies]
fm-core = { workspace = true }
fm-store = { workspace = true }
fm-persist = { workspace = true }
fm-embed = { workspace = true }
fm-similarity = { workspace = true }
fm-graph = { workspace = true }
fm-cluster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
# 凭据脱敏上游: fusion-guard fg-redact (PR fusion-guard#11 / issue #10 `redact_credentials` API,
# 仅跑凭据子集, 跳 PII)。fg-redact 补 fusion-memory 没有的凭据覆盖 (AWS Secret/JWT/PEM/bearer/
# GCP/Azure/Stripe/连接串/.env); PII (手机/身份证/银行卡/IPv4/护照/IPv6/国际手机) 由 fusion-memory
# 自带逻辑脱敏 (比 fg-redact PII 准, 见 redact.rs 段 2)。见 redact.rs。
# path dep (monorepo 同级兄弟项目 fusion-guard/crates/fg-redact)。100% 离线: 纯本地 path,
# 无 git fetch / 无 cloud。default 无 feature 门, 始终启用 (凭据脱敏为默认安全基线, §1.16 fail-closed)。
fg-redact = { path = "../../../fusion-guard/crates/fg-redact" }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
fm-embed = { workspace = true }
fm-persist = { workspace = true, features = ["test-utils"] }

# §13.2 perf 基线 bench (轻量手写, 无 criterion 重依赖, CI 友好)。
[[bench]]
name = "retrieve_bench"
harness = false

# P1-7: 规模验证 bench (10k/100k/1M)。跑法: FM_SCALE=<10k|100k|1m> cargo bench -p fm-engine --bench scale_bench
[[bench]]
name = "scale_bench"
harness = false
