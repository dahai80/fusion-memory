[package]
name = "fm-engine"
version = "1.4.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "fusion-memory 引擎: commit/retrieve/consolidate + 实体抽取 + 融合评分。PRD §6, §11.1, §11.4"

[features]
# 真实模型集成测试 (需起 fusion-mlx 加载 Qwen3.5-9B-4bit)
# 跑: cargo test -p fm-engine --features mlx-live --test mlx_live_extract -- --include-ignored
mlx-live = []

[dependencies]
fm-core = { workspace = true }
fm-store = { workspace = true }
fm-persist = { workspace = true }
fm-embed = { workspace = true }
fm-similarity = { workspace = true }
fm-graph = { workspace = true }
fm-cluster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
# 凭据脱敏上游: fusion-guard fg-redact (PR fusion-guard#11 / issue #10 `redact_credentials` API,
# 仅跑凭据子集, 跳 PII)。fg-redact 补 fusion-memory 没有的凭据覆盖 (AWS Secret/JWT/PEM/bearer/
# GCP/Azure/Stripe/连接串/.env); PII (手机/身份证/银行卡/IPv4/护照/IPv6/国际手机) 由 fusion-memory
# 自带逻辑脱敏 (比 fg-redact PII 准, 见 redact.rs 段 2)。见 redact.rs。
# git tag dep (issue #27: 跨仓 path dep 在 CI 独立 checkout 时 manifest 加载即断, main 红 3 连)。
# 上游 repo public (dahai80/fusion-guard), tag v0.2.0-rc.7 = 本地工作树同 commit, 零漂移。
# 100% 离线指运行时 (HTTP 仅 127.0.0.1); 构建期 cargo git fetch 一次后缓存 ~/.cargo/git。
# 本地改上游联调: cargo 源码级 patch — [patch."https://github.com/dahai80/fusion-guard"] 覆盖。
fg-redact = { git = "https://github.com/dahai80/fusion-guard", tag = "v0.2.0-rc.7" }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
fm-embed = { workspace = true }
fm-persist = { workspace = true, features = ["test-utils"] }

# §13.2 perf 基线 bench (轻量手写, 无 criterion 重依赖, CI 友好)。
[[bench]]
name = "retrieve_bench"
harness = false

# P1-7: 规模验证 bench (10k/100k/1M)。跑法: FM_SCALE=<10k|100k|1m> cargo bench -p fm-engine --bench scale_bench
[[bench]]
name = "scale_bench"
harness = false

# §13.2 live perf 基线: 真 bge-m3 (dim=1024) 端到端 retrieve 延迟。关闭 RC 已知限制 #1。
# gate: --features mlx-live。需起 fusion-mlx 加载 bge-m3。
# 跑: cargo bench -p fm-engine --features mlx-live --bench retrieve_bench_live
[[bench]]
name = "retrieve_bench_live"
harness = false
required-features = ["mlx-live"]
