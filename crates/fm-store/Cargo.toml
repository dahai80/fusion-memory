[package]
name = "fm-store"
version = "1.1.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "fusion-memory 向量存储 trait + local-store 生产后端"

[features]
default = ["local-store"]
local-store = ["hnsw_rs", "sled"]
# §1.4: store-fusion 与 local-store 互斥后端。非空壳: 命中时 fusion.rs 显式 compile_error
# (上游 fusion-store trait 对齐前阻断编译), 不再产出"无 store 实现的废 crate"。
# 上游就绪后换真实 impl (见 fusion.rs)。
store-fusion = []

[dependencies]
fm-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hnsw_rs = { workspace = true, optional = true }
sled = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
