[package]
name = "fm-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "fusion-memory 向量存储 trait + store-stub 生产后端"

[features]
default = ["store-stub"]
store-stub = ["hnsw_rs", "sled"]
