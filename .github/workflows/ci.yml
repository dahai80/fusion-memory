name: CI

# P0-5: CI 门禁。本 workflow 定义完整 (fmt/clippy/check/test + live-compile 编译门禁)。
# 审计 P0-5 记录: 当前 GitHub Actions 因账户 billing 未开通而未实际运行, 合并门禁等效为 0。
#   整改路径 (非代码, 账户层):
#     1. 开通 GitHub Actions billing (Settings → Billing → Actions spending limit 提高)。
#     2. 或迁 self-hosted runner (Apple Silicon, 见 deploy/README.md 离线约束)。
#   开通后本 workflow 即生效, 无需改代码。本地等效门禁: 见 README "本地 CI gate"。
#   关键依赖: branch protection rules 须设 CI 为 required check (repo Settings → Branches)。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: check
        run: cargo check --workspace
      - name: test
        run: cargo test --workspace

  # §1.6: 生产路径编译门禁。
  # 审计 §1.6: CI 默认构建中 mlx-live 门禁测试 (MlxEmbedder bge-m3 / consolidate saga /
  # 真实 HTTP) 编译 0 次, 生产路径覆盖率 = 0%。离线 325 绿对 live 路径零回归保护。
  # 本 job 编译全部 live-gated 测试 (--no-run), 每个 PR 验证 live 代码路径类型检查通过。
  # 实际执行 (需 fusion-mlx on Apple Silicon) 仍手工: 见 README "Live 测试"。
  live-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: compile mlx-live test paths
        run: |
          cargo test -p fm-embed  --features mlx-live --no-run
          cargo test -p fm-engine --features mlx-live --no-run
          cargo test -p fm-server --features mlx-live --no-run
